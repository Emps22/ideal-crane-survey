<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Crane Rental — Site Surveys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f4f5f6;
    --panel:#ffffff;
    --panel-raised:#eef0f1;
    --border:#dcdfe2;
    --amber:#f5a623;
    --amber-dark:#c9860f;
    --amber-ink:#9a6200;
    --text:#1c1d1f;
    --muted:#666b70;
    --danger:#c94a3f;
    --success:#2f8a45;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', -apple-system, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,h4{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0 0 0.4em 0;
  }
  #app{max-width:900px;margin:0 auto;padding-bottom:80px;}

  /* header */
  .hdr{padding:28px 20px 0 20px;}
  .hdr-inner{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{font-family:'Oswald', sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;}
  .brand span{color:var(--amber);}
  .brand-sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .hdr-nav{display:flex;gap:6px;}
  .hdr-nav button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;font-family:'Work Sans';font-size:13px;cursor:pointer;border-radius:var(--radius);
  }
  .hdr-nav button.active{border-color:var(--amber);color:var(--amber-ink);}
  .stripe{
    height:10px;margin-top:18px;
    background:repeating-linear-gradient(115deg, var(--amber) 0 22px, transparent 22px 40px);
  }
  .content{padding:28px 20px 0 20px;}

  /* panels */
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .panel-tight{padding:16px;}
  .eyebrow{color:var(--amber-ink);font-size:12px;font-weight:600;margin-bottom:6px;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}

  /* buttons */
  .btn{
    display:inline-block;background:var(--amber);color:#171717;border:none;
    font-family:'Oswald';font-weight:600;font-size:14px;letter-spacing:0.02em;
    padding:11px 20px;border-radius:var(--radius);cursor:pointer;text-decoration:none;
  }
  .btn:hover{background:var(--amber-dark);}
  .btn:disabled{background:#54514a;color:#8a8a8a;cursor:not-allowed;}
  .btn-outline{
    background:transparent;border:1px solid var(--border);color:var(--text);
    font-family:'Work Sans';font-weight:500;font-size:13px;padding:9px 16px;border-radius:var(--radius);cursor:pointer;
  }
  .btn-outline:hover{border-color:var(--amber);color:var(--amber-ink);}
  .btn-danger{border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#ffffff;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

  /* forms */
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:14px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=email],textarea,select{
    width:100%;background:var(--panel-raised);border:1px solid var(--border);color:var(--text);
    padding:10px 11px;font-family:'Work Sans';font-size:14px;border-radius:var(--radius);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:0;}
  textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:12px;}
  .field-row>div{flex:1;}

  .option-line{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .option-line input[type=text]{flex:1;}
  .option-line input[type=radio]{width:18px;height:18px;accent-color:var(--amber);}
  .tf-choice{display:flex;gap:10px;margin-top:8px;}
  .tf-choice label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);margin:0;cursor:pointer;}
  .tf-choice input{accent-color:var(--amber);width:16px;height:16px;}
  .mc-choice{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-top:8px;cursor:pointer;background:var(--panel-raised);}
  .mc-choice:hover{border-color:var(--amber);}
  .mc-choice input{accent-color:var(--amber);width:16px;height:16px;}
  .mc-choice.selected{border-color:var(--amber);}

  /* survey list cards */
  .survey-card{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .survey-card h3{font-size:18px;}
  .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:0.03em;padding:3px 8px;border-radius:2px;margin-right:6px;}
  .tag-open{background:rgba(92,174,107,0.15);color:var(--success);border:1px solid var(--success);}
  .tag-closed{background:rgba(226,83,75,0.12);color:var(--danger);border:1px solid var(--danger);}
  .tag-quiz{background:rgba(245,166,35,0.12);color:var(--amber-ink);border:1px solid var(--amber);}

  .progress-track{height:6px;background:var(--panel-raised);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--amber);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;}
  tr:hover td{background:rgba(255,255,255,0.02);}

  .winner-box{
    text-align:center;padding:30px 20px;border:1px solid var(--amber);border-radius:var(--radius);
    background:rgba(245,166,35,0.07);
  }
  .winner-name{font-family:'Oswald';font-size:28px;color:var(--amber-ink);margin:8px 0 4px 0;}

  .empty{padding:30px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);}
  .divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
  .qcard{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;background:var(--panel-raised);}
  .qcard-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .qnum{color:var(--amber-ink);font-family:'Oswald';font-size:13px;font-weight:600;}
  .review-item{border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:var(--panel-raised);text-align:left;}
  .review-item.review-correct{border-left-color:var(--success);}
  .review-item.review-incorrect{border-left-color:var(--danger);}
  .review-hdr{display:flex;justify-content:space-between;align-items:center;}
  .review-explain{margin-top:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;}
  .review-explain strong{color:var(--amber-ink);font-family:'Oswald';font-weight:600;letter-spacing:0.02em;}
  /* winner wheel */
  .wheel-panel{text-align:center;}
  .wheel-wrap{max-width:440px;margin:0 auto;}
  .wheel-wrap canvas{width:100%;height:auto;display:block;}
  .wheel-ticker{font-family:'Oswald',sans-serif;font-size:20px;min-height:30px;margin-top:6px;color:var(--text);}
  .sound-toggle{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted);cursor:pointer;}
  .sound-toggle input{accent-color:var(--amber);width:16px;height:16px;}

  /* celebration overlay */
  #fx-overlay{position:fixed;inset:0;z-index:9999;background:rgba(6,8,16,0.88);opacity:0;transition:opacity .45s ease;cursor:pointer;}
  #fx-overlay.show{opacity:1;}
  #fx-overlay canvas{position:absolute;inset:0;width:100%;height:100%;}
  .fx-text{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;padding:0 20px;}
  .fx-kicker{font-family:'Oswald',sans-serif;letter-spacing:.3em;color:#ffd98a;font-size:clamp(14px,2.4vw,22px);margin-bottom:6px;}
  .fx-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(40px,10vw,120px);line-height:1.05;color:#fff;
           text-shadow:0 0 30px rgba(245,166,35,.85),0 4px 18px rgba(0,0,0,.6);word-break:break-word;
           animation:fxpop .8s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes fxpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .fx-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:13px;pointer-events:none;}
  .footer-note{color:var(--muted);font-size:12px;text-align:center;padding:20px;}
  a{color:var(--amber-ink);}
  .err{color:var(--danger);font-size:13px;margin-top:8px;}
  .link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .link-btn:hover{color:var(--amber-ink);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------------
   CONFIG
--------------------------------------------------------------- */
const ADMIN_PASSWORD = "IdealSafety2026"; // change this string to set your own admin password

/* ---------------------------------------------------------------
   STATE
--------------------------------------------------------------- */
let state = {
  view: 'home',          // home | take | done | adminLogin | adminSurveys | adminEdit | adminResponses
  surveys: [],
  loaded: false,
  activeSurveyId: null,
  isAdmin: false,
  loginError: '',
  // taking a survey
  takeStep: 0,             // 0 = intro/name, 1..n = questions, n+1 = review
  takeName: '',
  takeAnswers: {},
  takeError: '',
  // editing
  editDraft: null,
  // responses view
  responsesCache: {},      // surveyId -> array
  winner: null
};

/* ---------------------------------------------------------------
   STORAGE HELPERS — backed by a Netlify Function + Netlify Blobs
--------------------------------------------------------------- */
async function apiGet(key){
  try{
    const res = await fetch('/.netlify/functions/data?key=' + encodeURIComponent(key));
    if(!res.ok) return null;
    const data = await res.json();
    return data.value;
  }catch(e){ console.error('load failed', e); return null; }
}
async function apiSet(key, value){
  try{
    await fetch('/.netlify/functions/data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key, value })
    });
  }catch(e){ console.error('save failed', e); }
}

async function loadSurveys(){
  const v = await apiGet('surveys');
  return v ? JSON.parse(v) : [];
}
async function saveSurveys(surveys){
  await apiSet('surveys', JSON.stringify(surveys));
}
async function loadResponses(surveyId){
  const v = await apiGet('responses:'+surveyId);
  return v ? JSON.parse(v) : [];
}
async function saveResponses(surveyId, responses){
  await apiSet('responses:'+surveyId, JSON.stringify(responses));
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

/* ---------------------------------------------------------------
   BOOT
--------------------------------------------------------------- */
async function boot(){
  state.surveys = await loadSurveys();
  state.loaded = true;

  // deep link: a URL like ...#survey=abc123 opens straight into that survey
  const hashMatch = location.hash.match(/survey=([^&]+)/);
  if(hashMatch){
    const s = state.surveys.find(x=>x.id===hashMatch[1]);
    if(s && s.status==='open'){
      state.activeSurveyId = s.id;
      state.view = 'take';
      state.takeStep = 0;
    }
  }
  render();
}
boot();

/* ---------------------------------------------------------------
   RENDER ROOT
--------------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = header() + '<div class="content">' + body() + '</div>' + footer();
  if(state.view === 'adminShare') renderQrCode();
  if(state.view === 'adminResponses') setupWheel();
}

function renderQrCode(){
  const s = state.surveys.find(x=>x.id===state.shareSurveyId);
  const container = document.getElementById('qr-container');
  if(!s || !container) return;
  if(typeof QRCode === 'undefined'){
    container.innerHTML = '<span style="color:#555;font-size:12px;padding:10px;">QR code library failed to load — use the link above instead.</span>';
    return;
  }
  const base = window.location.href.split('#')[0];
  const link = base + '#survey=' + s.id;
  container.innerHTML = '';
  new QRCode(container, { text: link, width:200, height:200, colorDark:"#171717", colorLight:"#ffffff" });
}

function header(){
  const navHome = state.view.startsWith('admin') ? '' : 'active';
  return `
  <div class="hdr">
    <div class="hdr-inner">
      <div>
        <div class="brand">IDEAL <span>CRANE RENTAL</span></div>
        <div class="brand-sub">Site Surveys &amp; Safety Trivia</div>
      </div>
      <div class="hdr-nav">
        <button class="${state.view.startsWith('admin') ? '' : 'active'}" onclick="goHome()">Surveys</button>
        <button class="${state.view.startsWith('admin') ? 'active' : ''}" onclick="goAdmin()">Admin</button>
      </div>
    </div>
    <div class="stripe"></div>
  </div>`;
}

function footer(){
  return `<div class="footer-note">Ideal Crane Rental &middot; Internal survey tool</div>`;
}

/* ---------------------------------------------------------------
   NAV HELPERS
--------------------------------------------------------------- */
function goHome(){
  state.view='home'; state.activeSurveyId=null; state.takeStep=0;
  state.takeName=''; state.takeAnswers={}; state.takeError='';
  render();
}
function goAdmin(){
  state.view = state.isAdmin ? 'adminSurveys' : 'adminLogin';
  render();
}

/* ---------------------------------------------------------------
   BODY ROUTER
--------------------------------------------------------------- */
function body(){
  if(!state.loaded) return `<div class="empty">Loading surveys&hellip;</div>`;
  switch(state.view){
    case 'home': return viewHome();
    case 'take': return viewTake();
    case 'done': return viewDone();
    case 'adminLogin': return viewAdminLogin();
    case 'adminSurveys': return viewAdminSurveys();
    case 'adminEdit': return viewAdminEdit();
    case 'adminResponses': return viewAdminResponses();
    case 'adminShare': return viewAdminShare();
    default: return viewHome();
  }
}

/* =================================================================
   PUBLIC: HOME
================================================================= */
function viewHome(){
  const open = state.surveys.filter(s=>s.status==='open');
  if(open.length===0){
    return `
    <div class="panel">
      <h2>No surveys open right now</h2>
      <p class="muted">Check back soon — this month's safety trivia (and any other surveys) will show up here as soon as they're live.</p>
    </div>`;
  }
  return open.map(s=>`
    <div class="panel">
      <div class="survey-card">
        <div>
          <div>
            <span class="tag tag-open">OPEN</span>
            ${s.isQuiz ? '<span class="tag tag-quiz">TRIVIA</span>' : ''}
          </div>
          <h3>${escapeHtml(s.title)}</h3>
          <p class="muted small">${escapeHtml(s.description || '')}</p>
          ${s.prize ? `<p class="small"><strong style="color:var(--amber-ink)">Prize:</strong> ${escapeHtml(s.prize)}</p>` : ''}
          <p class="muted small">${s.questions.length} question${s.questions.length===1?'':'s'}</p>
        </div>
        <button class="btn" onclick="startSurvey('${s.id}')">Take Survey</button>
      </div>
    </div>
  `).join('');
}

function startSurvey(id){
  state.activeSurveyId = id;
  state.view = 'take';
  state.takeStep = 0;
  state.takeName=''; state.takeAnswers={}; state.takeError='';
  render();
}

/* =================================================================
   PUBLIC: TAKE SURVEY
================================================================= */
function currentSurvey(){
  return state.surveys.find(s=>s.id===state.activeSurveyId);
}

function viewTake(){
  const s = currentSurvey();
  if(!s) return `<div class="empty">This survey is no longer available.</div>`;
  const total = s.questions.length;

  // step 0: name intro
  if(state.takeStep === 0){
    return `
    <div class="panel">
      <div class="eyebrow">${s.isQuiz ? 'TRIVIA ENTRY' : 'SURVEY'}</div>
      <h2>${escapeHtml(s.title)}</h2>
      <p class="muted">${escapeHtml(s.description || '')}</p>
      ${s.prize ? `<p class="small"><strong style="color:var(--amber-ink)">Prize:</strong> ${escapeHtml(s.prize)}</p>` : ''}
      <hr class="divider">
      <label>Your name</label>
      <input type="text" id="take-name" value="${escapeAttr(state.takeName)}" placeholder="First and last name">
      ${state.takeError ? `<div class="err">${escapeHtml(state.takeError)}</div>` : ''}
      <div class="btn-row">
        <button class="btn" onclick="beginQuestions()">Start (${total} question${total===1?'':'s'})</button>
        <button class="btn-outline" onclick="goHome()">Cancel</button>
      </div>
    </div>`;
  }

  // review/submit step
  if(state.takeStep === total + 1){
    return `
    <div class="panel">
      <h2>Ready to submit?</h2>
      <p class="muted">You've answered all ${total} questions. Submitting locks in your answers.</p>
      ${state.takeError ? `<div class="err">${escapeHtml(state.takeError)}</div>` : ''}
      <div class="btn-row">
        <button class="btn" onclick="submitSurvey()">Submit</button>
        <button class="btn-outline" onclick="state.takeStep=total; render();">Back</button>
      </div>
    </div>`;
  }

  // question step
  const q = s.questions[state.takeStep-1];
  const pct = Math.round((state.takeStep-1)/total*100);
  return `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="panel">
      <div class="eyebrow">Question ${state.takeStep} of ${total}</div>
      <h3>${escapeHtml(q.text)}</h3>
      ${renderQuestionInput(q)}
      ${state.takeError ? `<div class="err">${escapeHtml(state.takeError)}</div>` : ''}
      <div class="btn-row">
        ${state.takeStep>1 ? `<button class="btn-outline" onclick="prevQuestion()">Back</button>` : ''}
        <button class="btn" onclick="nextQuestion()">${state.takeStep===total?'Review':'Next'}</button>
      </div>
    </div>
  `;
}

function renderQuestionInput(q){
  const val = state.takeAnswers[q.id];
  if(q.type==='multiple_choice'){
    return q.options.map((opt,i)=>`
      <label class="mc-choice ${val===i?'selected':''}">
        <input type="radio" name="q_${q.id}" ${val===i?'checked':''} onchange="setAnswer('${q.id}', ${i})">
        <span>${escapeHtml(opt)}</span>
      </label>
    `).join('');
  }
  if(q.type==='true_false'){
    return `
    <div class="tf-choice">
      <label><input type="radio" name="q_${q.id}" ${val===true?'checked':''} onchange="setAnswer('${q.id}', true)"> True</label>
      <label><input type="radio" name="q_${q.id}" ${val===false?'checked':''} onchange="setAnswer('${q.id}', false)"> False</label>
    </div>`;
  }
  // fill_blank
  return `<input type="text" value="${escapeAttr(val||'')}" placeholder="Type your answer" oninput="setAnswer('${q.id}', this.value)">`;
}

function setAnswer(qId, val){
  state.takeAnswers[qId] = val;
  if(currentSurvey().questions[state.takeStep-1].type==='multiple_choice'){
    render(); // re-render so selection highlight updates
  }
}

function beginQuestions(){
  const name = document.getElementById('take-name').value.trim();
  if(!name){
    state.takeError = 'Please enter your name.';
    render(); return;
  }
  state.takeName = name; state.takeError='';
  state.takeStep = 1;
  render();
}

function nextQuestion(){
  const s = currentSurvey();
  const q = s.questions[state.takeStep-1];
  const val = state.takeAnswers[q.id];
  if(val===undefined || val===null || val===''){
    state.takeError = 'Please answer this question before continuing.';
    render(); return;
  }
  state.takeError='';
  state.takeStep++;
  render();
}
function prevQuestion(){
  state.takeError='';
  state.takeStep--;
  render();
}

async function submitSurvey(){
  const s = currentSurvey();
  let score = 0;
  const review = [];
  s.questions.forEach(q=>{
    const given = state.takeAnswers[q.id];
    const correct = isCorrect(q, given);
    if(correct) score++;
    review.push({
      text: q.text,
      correct: correct,
      givenDisplay: formatAnswerDisplay(q, given),
      correctDisplay: formatAnswerDisplay(q, q.correctAnswer),
      explanation: (q.explanation || '').trim()
    });
  });
  const responses = await loadResponses(s.id);
  responses.push({
    id: uid('r'),
    surveyId: s.id,
    name: state.takeName,
    answers: state.takeAnswers,
    score: score,
    total: s.questions.length,
    submittedAt: new Date().toISOString()
  });
  await saveResponses(s.id, responses);
  state.view='done';
  state.lastScore = score;
  state.lastReview = review;
  render();
}

function formatAnswerDisplay(q, val){
  if(val===undefined || val===null || val==='') return '(no answer)';
  if(q.type==='multiple_choice') return q.options[val] !== undefined ? q.options[val] : '(no answer)';
  if(q.type==='true_false') return val===true ? 'True' : val===false ? 'False' : '(no answer)';
  return String(val);
}

function isCorrect(q, given){
  if(q.type==='multiple_choice') return given===q.correctAnswer;
  if(q.type==='true_false') return given===q.correctAnswer;
  if(q.type==='fill_blank'){
    if(given===undefined || given===null) return false;
    return String(given).trim().toLowerCase() === String(q.correctAnswer||'').trim().toLowerCase();
  }
  return false;
}

function viewDone(){
  const s = currentSurvey();
  const showReview = s && s.isQuiz && Array.isArray(state.lastReview);
  return `
  <div class="panel" style="text-align:center;padding:36px 20px;">
    <h2>Thanks, ${escapeHtml(state.takeName)}!</h2>
    <p class="muted">Your answers have been submitted${s && s.isQuiz ? ` for <strong style="color:var(--text)">${escapeHtml(s.title)}</strong>` : ''}.</p>

    createdAt: new Date().toISOString(),

  };

function editSurvey(id){

  state.editDraft = JSON.parse(JSON.stringify(s));
  state.view = 'adminEdit';

async function toggleStatus(id){

async function deleteSurvey(id){

  state.surveys = state.surveys.filter(x=>x.id!==id);

function duplicateSurvey(id){

  const copy = JSON.parse(JSON.stringify(s));
  copy.id = uid('s');

function renderQuestionEditor(q, i, isQuiz){
  let inner = '';
  if(q.type==='multiple_choice'){
    inner = q.options.map((opt,oi)=>`
      <div class="option-line">
        ${isQuiz ? `<input type="radio" name="correct_${q.id}" ${q.correctAnswer===oi?'checked':''} onchange="setDraftCorrect('${q.id}', ${oi})" title="Mark correct">` : ''}
        <input type="text" value="${escapeAttr(opt)}" placeholder="Option ${oi+1}" oninput="setOption('${q.id}', ${oi}, this.value)">
        <button class="btn-outline btn-danger" style="padding:5px 9px;" onclick="removeOption('${q.id}', ${oi})">&times;</button>
      </div>
    `).join('') + `<div class="btn-row"><button class="btn-outline" onclick="addOption('${q.id}')">+ Add option</button></div>`;
  }else if(q.type==='true_false'){
    inner = isQuiz ? `
    <div class="tf-choice">
      <label><input type="radio" name="tfcorrect_${q.id}" ${q.correctAnswer===true?'checked':''} onchange="setDraftCorrect('${q.id}', true)"> True is correct</label>
      <label><input type="radio" name="tfcorrect_${q.id}" ${q.correctAnswer===false?'checked':''} onchange="setDraftCorrect('${q.id}', false)"> False is correct</label>
    </div>` : `<p class="muted small">Respondents choose True or False.</p>`;
  }else{
    inner = isQuiz ? `
    <label>Correct answer (case-insensitive)</label>
    <input type="text" value="${escapeAttr(q.correctAnswer||'')}" placeholder="Expected answer" oninput="setDraftCorrect('${q.id}', this.value)">
    ` : `<p class="muted small">Respondents type a free-text answer.</p>`;
  }
  const typeLabel = q.type==='multiple_choice' ? 'Multiple choice' : q.type==='true_false' ? 'True / False' : 'Fill in the blank';
  return `
  <div class="qcard">
    <div class="qcard-hdr">
      <span class="qnum">Q${i+1} &middot; ${typeLabel}</span>
      <button class="btn-outline btn-danger" style="padding:5px 9px;" onclick="removeQuestion('${q.id}')">Remove</button>
    </div>
    <label>Question text</label>
    <input type="text" value="${escapeAttr(q.text)}" placeholder="Enter the question" oninput="setQuestionText('${q.id}', this.value)">
    ${inner}
    ${isQuiz ? `
    <label>Explanation (optional — shown to everyone after they submit, whether they got it right or wrong)</label>
    <textarea placeholder="Why is this the right answer? e.g. A hard hat is required anywhere there is an overhead hazard." oninput="setExplanation('${q.id}', this.value)">${escapeHtml(q.explanation||'')}</textarea>
    ` : ''}
  </div>`;
}

function setExplanation(qId, val){
  const q = state.editDraft.questions.find(q=>q.id===qId);
  q.explanation = val;
}

function syncTopFields(){
  // preserve any unsaved title/description/prize/type edits before a re-render
  const d = state.editDraft;
  if(!d) return;
  const t = document.getElementById('ed-title'); if(t) d.title = t.value;
  const desc = document.getElementById('ed-desc'); if(desc) d.description = desc.value;
  const p = document.getElementById('ed-prize'); if(p) d.prize = p.value;
  const q = document.getElementById('ed-isquiz'); if(q) d.isQuiz = (q.value === 'true');
}

function setDraftIsQuiz(val){
  syncTopFields();
  state.editDraft.isQuiz = (val === 'true');
  render();
}

function addQuestion(type){
  syncTopFields();
  const q = { id: uid('q'), type, text: '' };
  if(type==='multiple_choice'){ q.options=['','']; q.correctAnswer=0; }
  if(type==='true_false'){ q.correctAnswer=true; }
  if(type==='fill_blank'){ q.correctAnswer=''; }
  state.editDraft.questions.push(q);
  render();
}
function removeQuestion(qId){
  syncTopFields();
  state.editDraft.questions = state.editDraft.questions.filter(q=>q.id!==qId);
  render();
}
function setQuestionText(qId, val){
  const q = state.editDraft.questions.find(q=>q.id===qId);
  q.text = val;
}
function addOption(qId){
  syncTopFields();
  const q = state.editDraft.questions.find(q=>q.id===qId);
  q.options.push('');
  render();
}
function removeOption(qId, idx){
  syncTopFields();
  const q = state.editDraft.questions.find(q=>q.id===qId);
  q.options.splice(idx,1);
  if(q.correctAnswer>=q.options.length) q.correctAnswer=0;
  render();
}
function setOption(qId, idx, val){
  const q = state.editDraft.questions.find(q=>q.id===qId);
  q.options[idx] = val;
}
function setDraftCorrect(qId, val){
  const q = state.editDraft.questions.find(q=>q.id===qId);
  q.correctAnswer = val;
}

async function saveDraft(){
  const d = state.editDraft;
  d.title = document.getElementById('ed-title').value.trim();
  d.description = document.getElementById('ed-desc').value.trim();
  d.prize = document.getElementById('ed-prize').value.trim();
  d.isQuiz = document.getElementById('ed-isquiz').value === 'true';

  if(!d.title){ alert('Please enter a title.'); return; }
  if(d.questions.length===0){ alert('Add at least one question.'); return; }
  for(const q of d.questions){
    if(!q.text.trim()){ alert('Every question needs question text.'); return; }
    if(q.type==='multiple_choice' && q.options.filter(o=>o.trim()).length<2){
      alert('Multiple choice questions need at least 2 options.'); return;
    }
  }

  const idx = state.surveys.findIndex(s=>s.id===d.id);
  if(idx>=0) state.surveys[idx]=d; else state.surveys.push(d);
  await saveSurveys(state.surveys);
  state.view='adminSurveys';
  render();
}

/* =================================================================
   ADMIN: RESPONSES + WINNER PICKER
================================================================= */
function viewAdminResponses(){
  const s = state.surveys.find(x=>x.id===state.activeSurveyId);
  if(!s) return `<div class="empty">Survey not found.</div>`;
  const responses = state.responsesCache[s.id];
  if(responses===undefined) return `<div class="empty">Loading responses&hellip;</div>`;

  const maxScore = s.questions.length;
  const minScore = effectiveMinScore(s);
  const eligible = getEligible(s, responses);
  let minOptions = '';
  for(let k=maxScore;k>=1;k--){
    const count = responses.filter(r=>r.score>=k).length;
    const label = (k===maxScore ? `Perfect score only (${k}/${maxScore})` : `${k}/${maxScore} or better`) + ` \u2014 ${count} ${count===1?'person':'people'}`;
    minOptions += `<option value="${k}" ${k===minScore?'selected':''}>${label}</option>`;
  }

  return `
  <div class="panel">
    <div class="eyebrow">${escapeHtml(s.title)}</div>
    <h2 style="margin-bottom:2px;">Responses (${responses.length})</h2>
    <p class="muted small">${s.isQuiz ? `${eligible.length} ${eligible.length===1?'person is':'people are'} in the drawing (${minScore===maxScore ? 'perfect score' : 'scored '+minScore+'/'+maxScore+' or better'}).` : 'This is a plain survey — everyone who responded is eligible for a drawing.'}</p>
    ${s.isQuiz ? `
    <label for="min-score">Who enters the drawing</label>
    <select id="min-score" style="max-width:380px;" onchange="setMinScore(this.value)">${minOptions}</select>
    ` : ''}
  </div>

  ${responses.length>0 ? `
  <div class="panel wheel-panel">
    ${eligible.length>0 ? `
      <div class="eyebrow">WINNER DRAWING</div>
      <div class="wheel-wrap"><canvas id="wheel-canvas" width="880" height="880" role="img" aria-label="Winner wheel"></canvas></div>
      <div class="wheel-ticker" id="wheel-ticker"></div>
      <div class="btn-row" style="justify-content:center;align-items:center;">
        <button class="btn" id="spin-btn" onclick="spinWheel()">${state.winner ? 'Spin again' : 'Spin the wheel'}</button>
        <label class="sound-toggle"><input type="checkbox" ${soundOn?'checked':''} onchange="setSound(this.checked)"> Sound</label>
      </div>
    ` : `<p class="muted" style="margin:0;">Nobody has scored ${minScore===maxScore ? 'a perfect '+maxScore+'/'+maxScore : minScore+'/'+maxScore+' or better'} yet, so there is no one to draw.</p>`}
    <div id="winner-slot">${state.winner ? winnerBoxHtml(state.winner) : ''}</div>
  </div>
  <div class="panel">
    <table>
      <thead><tr><th>Name</th>${s.isQuiz?'<th>Score</th><th>Drawing</th>':''}<th>Submitted</th></tr></thead>
      <tbody>
        ${responses.slice().sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt)).map(r=>`
          <tr>
            <td>${escapeHtml(r.name)}</td>
            ${s.isQuiz?`<td>${r.score}/${r.total}</td><td>${r.score>=minScore?'<span class="tag tag-open">IN DRAWING</span>':''}</td>`:''}
            <td class="muted">${formatDate(r.submittedAt)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  ` : `<div class="empty">No responses yet.</div>`}

  <div class="btn-row"><button class="btn-outline" onclick="state.view='adminSurveys'; render();">Back to surveys</button></div>
  `;
}

/* =================================================================
   ADMIN: WINNER WHEEL + CELEBRATION
================================================================= */
const WHEEL_SIZE = 440;
const WHEEL_COLORS = [
  {bg:'#f5a623', fg:'#1c1d1f'},
  {bg:'#2b2d30', fg:'#ffffff'},
  {bg:'#ffd98a', fg:'#1c1d1f'},
  {bg:'#5a5f66', fg:'#ffffff'},
  {bg:'#c9860f', fg:'#ffffff'},
  {bg:'#e9ebed', fg:'#1c1d1f'}
];
let wheelEntries = [];
let wheelRotation = 0;      // radians, persists between spins
let wheelSpinning = false;
let soundOn = true;

function setSound(v){ soundOn = !!v; if(soundOn) audioInit(); }

function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// Fair random pick (uses the browser's cryptographic random source when available)
function secureRandomInt(n){
  if(window.crypto && window.crypto.getRandomValues){
    const max = Math.floor(0xFFFFFFFF / n) * n;
    const buf = new Uint32Array(1);
    do { window.crypto.getRandomValues(buf); } while(buf[0] >= max);
    return buf[0] % n;
  }
  return Math.floor(Math.random() * n);
}
function secureRandomFloat(){ return secureRandomInt(1000000) / 1000000; }

// Lowest score that still enters the drawing. Defaults to a perfect score until the admin changes it.
function effectiveMinScore(s){
  const total = s.questions.length;
  const m = parseInt(s.minScore, 10);
  if(isNaN(m)) return total;
  return Math.max(1, Math.min(total, m));
}

function getEligible(s, responses){
  const min = effectiveMinScore(s);
  return s.isQuiz ? responses.filter(r=>r.score >= min) : responses;
}

async function setMinScore(v){
  if(wheelSpinning){ render(); return; }
  const s = state.surveys.find(x=>x.id===state.activeSurveyId);
  if(!s) return;
  s.minScore = parseInt(v, 10);
  state.winner = null;
  wheelRotation = 0;
  render();
  await saveSurveys(state.surveys);     // remembered for next time (and copied when you Duplicate)
}

function winnerBoxHtml(w){
  return `
    <div class="winner-box" style="margin-top:16px;">
      <div class="muted small">WINNER</div>
      <div class="winner-name">${escapeHtml(w.name)}</div>
    </div>`;
}

/* ---------------- wheel drawing ---------------- */
function wheelColorIndex(i, n){
  let ci = i % WHEEL_COLORS.length;
  if(i === n-1 && n > 1 && ci === 0) ci = 3;   // keep the last slice from matching the first
  return ci;
}

// Which slice is under the pointer (the pointer sits at the top, i.e. -90 degrees)
function wheelIndexAt(rot, n){
  const a = (Math.PI*2) / n;
  let ang = (-Math.PI/2 - rot) % (Math.PI*2);
  if(ang < 0) ang += Math.PI*2;
  return Math.floor(ang / a) % n;
}

function drawWheel(rotation){
  const canvas = document.getElementById('wheel-canvas');
  const n = wheelEntries.length;
  if(!canvas || n === 0) return;
  const ctx = canvas.getContext('2d');
  const S = WHEEL_SIZE, c = S/2, R = c - 26;
  const k = canvas.width / S;
  ctx.setTransform(k,0,0,k,0,0);
  ctx.clearRect(0,0,S,S);

  const a = (Math.PI*2) / n;

  // outer ring
  ctx.beginPath(); ctx.arc(c,c,R+8,0,Math.PI*2); ctx.fillStyle = '#1c1d1f'; ctx.fill();

  // slices
  for(let i=0;i<n;i++){
    const start = rotation + i*a;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,start,start+a); ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[wheelColorIndex(i,n)].bg; ctx.fill();
    if(a*R > 6){ ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1; ctx.stroke(); }
  }

  // names (skipped when there are too many slices to read; the ticker shows the name instead)
  const fontPx = n === 1 ? 20 : Math.min(18, a*R*0.4);
  if(fontPx >= 8){
    const maxLen = R*0.64;
    for(let i=0;i<n;i++){
      const col = WHEEL_COLORS[wheelColorIndex(i,n)];
      ctx.save();
      ctx.translate(c,c); ctx.rotate(rotation + (i+0.5)*a);
      ctx.font = `600 ${fontPx}px 'Work Sans', sans-serif`;
      ctx.fillStyle = col.fg; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      let t = String(wheelEntries[i]);
      if(ctx.measureText(t).width > maxLen){
        while(t.length > 2 && ctx.measureText(t + '…').width > maxLen) t = t.slice(0,-1);
        t += '…';
      }
      ctx.fillText(t, R-14, 0);
      ctx.restore();
    }
  }

  // hub
  ctx.beginPath(); ctx.arc(c,c,24,0,Math.PI*2); ctx.fillStyle = '#1c1d1f'; ctx.fill();
  ctx.beginPath(); ctx.arc(c,c,9,0,Math.PI*2); ctx.fillStyle = '#f5a623'; ctx.fill();

  // pointer (fixed at the top)
  ctx.beginPath();
  ctx.moveTo(c, c-R+14); ctx.lineTo(c-15, c-R-16); ctx.lineTo(c+15, c-R-16); ctx.closePath();
  ctx.fillStyle = '#f5a623'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#1c1d1f'; ctx.lineJoin = 'round'; ctx.stroke();
}

function setTicker(text){
  const el = document.getElementById('wheel-ticker');
  if(el) el.textContent = text;
}

// Called after every render() on the Responses page
function setupWheel(){
  const s = state.surveys.find(x=>x.id===state.activeSurveyId);
  const responses = s && state.responsesCache[s.id];
  if(!s || !responses) return;
  const eligible = getEligible(s, responses);
  wheelEntries = eligible.map(r=>r.name);
  if(eligible.length === 0) return;
  drawWheel(wheelRotation);
  setTicker(state.winner ? state.winner.name : (wheelSpinning ? '' : 'Ready to spin'));
}

function spinWheel(){
  if(wheelSpinning) return;
  const s = state.surveys.find(x=>x.id===state.activeSurveyId);
  const responses = s && state.responsesCache[s.id];
  if(!s || !responses) return;
  const eligible = getEligible(s, responses);
  if(eligible.length === 0) return;

  audioInit();   // must start from this click so the browser allows sound

  const entries = eligible.map(r=>r.name);
  wheelEntries = entries;
  const n = entries.length;
  const a = (Math.PI*2) / n;

  // Decide the winner up front (fairly), then animate the wheel to land on them.
  const winnerIdx = secureRandomInt(n);
  const jitter = (secureRandomFloat() - 0.5) * 0.7 * a;       // land somewhere inside the slice, not dead centre
  const targetMod = -Math.PI/2 - (winnerIdx + 0.5)*a + jitter;
  const reduce = prefersReducedMotion();
  const spins = reduce ? 1 : 6 + secureRandomInt(3);
  const start = wheelRotation;
  let delta = (targetMod - start) % (Math.PI*2);
  if(delta < 0) delta += Math.PI*2;
  const total = delta + Math.PI*2*spins;
  const duration = reduce ? 1500 : 6500;

  // hide the previous winner, lock the button
  state.winner = null;
  const slot = document.getElementById('winner-slot'); if(slot) slot.innerHTML = '';
  const btn = document.getElementById('spin-btn'); if(btn){ btn.disabled = true; btn.textContent = 'Spinning...'; }
  const minSel = document.getElementById('min-score'); if(minSel) minSel.disabled = true;

  wheelSpinning = true;
  const t0 = performance.now();
  let lastIdx = wheelIndexAt(start, n), lastTick = 0;

  function frame(now){
    if(!document.getElementById('wheel-canvas')){ wheelSpinning = false; return; }   // navigated away mid-spin
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    wheelRotation = start + total*eased;
    drawWheel(wheelRotation);
    const idx = wheelIndexAt(wheelRotation, n);
    if(idx !== lastIdx){
      lastIdx = idx;
      setTicker(entries[idx]);
      if(now - lastTick > 45){ lastTick = now; playTick(); }
    }
    if(p < 1){ requestAnimationFrame(frame); return; }

    // landed
    wheelRotation = ((wheelRotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    wheelSpinning = false;
    state.winner = eligible[winnerIdx];
    render();                       // redraws the wheel at rest and shows the winner box
    celebrate(state.winner.name);
  }
  requestAnimationFrame(frame);
}

/* ---------------- sound (synthesized, no audio files) ---------------- */
let audioCtx = null, masterGain = null, noiseBuf = null;

function audioInit(){
  if(!soundOn) return;
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(audioCtx.destination);
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ audioCtx = null; }
}
function sfxOK(){ return soundOn && audioCtx && masterGain && noiseBuf; }

function noiseBurst(o){
  if(!sfxOK()) return;
  try{
    const when = o.when || 0, dur = o.dur || 0.2, gain = o.gain || 0.2;
    const t = audioCtx.currentTime + when;
    const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = o.type || 'lowpass';
    filt.frequency.setValueAtTime(o.f0 || 800, t);
    if(o.f1) filt.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    filt.Q.value = o.q || 1;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start(t, Math.random()*1.0, dur + 0.05);
  }catch(e){}
}

function tone(o){
  if(!sfxOK()) return;
  try{
    const when = o.when || 0, dur = o.dur || 0.2, gain = o.gain || 0.12;
    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(o.freq || 440, t);
    if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + dur + 0.05);
  }catch(e){}
}

function playTick(){ tone({freq:1500, dur:0.03, type:'square', gain:0.035}); }
function playWhoosh(){ noiseBurst({dur:0.6, type:'bandpass', f0:300, f1:2200, gain:0.1, q:2}); }
function playBoom(size){
  size = size || 1;
  noiseBurst({dur:0.8, type:'lowpass', f0:900, f1:120, gain:0.45*size});
  tone({freq:130, slideTo:40, dur:0.55, type:'sine', gain:0.45*size});
  for(let i=0;i<8;i++) noiseBurst({when:0.1 + Math.random()*0.5, dur:0.03, type:'highpass', f0:3000, gain:0.07*size});
}
function playFanfare(){
  const seq = [523.25, 659.25, 783.99, 1046.5];            // C5 E5 G5 C6
  seq.forEach((f,i)=>tone({when:i*0.13, dur:0.22, freq:f, type:'square', gain:0.07}));
  [523.25, 659.25, 783.99, 1046.5].forEach(f=>tone({when:0.55, dur:1.1, freq:f, type:'triangle', gain:0.09}));
}
function playApplause(){
  for(let i=0;i<110;i++){
    noiseBurst({when:0.3 + Math.random()*3.4, dur:0.02 + Math.random()*0.035, type:'bandpass',
                f0:1500 + Math.random()*2800, gain:0.05 + Math.random()*0.07, q:0.8});
  }
}

/* ---------------- fireworks + confetti overlay ---------------- */
const fx = { running:false, raf:0, last:0, t0:0, w:0, h:0, s:1, ca:null, cb:null, xa:null, xb:null,
             rockets:[], sparks:[], confetti:[], schedule:[], cannons:[], rainFrom:0, rainUntil:0 };
const CONFETTI_COLORS = ['#f5a623','#ffd98a','#ffffff','#e2534b','#3b82f6','#34d399','#f472b6','#a78bfa'];

window.addEventListener('resize', ()=>{ if(fx.running && fx.ca) fxResize(); });

function fxResize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.w = window.innerWidth; fx.h = window.innerHeight;
  fx.s = Math.max(0.6, Math.min(1.4, fx.h/800));
  [fx.ca, fx.cb].forEach(cv=>{ cv.width = Math.round(fx.w*dpr); cv.height = Math.round(fx.h*dpr); });
  fx.xa = fx.ca.getContext('2d'); fx.xb = fx.cb.getContext('2d');
  fx.xa.setTransform(dpr,0,0,dpr,0,0); fx.xb.setTransform(dpr,0,0,dpr,0,0);
}

function celebrate(name){
  if(prefersReducedMotion()) return;          // the winner box already shows the result
  endCelebration(true);
  const overlay = document.createElement('div');
  overlay.id = 'fx-overlay';
  overlay.innerHTML =
    '<canvas id="fx-sparks"></canvas><canvas id="fx-confetti"></canvas>' +
    '<div class="fx-text"><div class="fx-kicker">AND THE WINNER IS</div><div class="fx-name"></div></div>' +
    '<div class="fx-hint">Click anywhere to close</div>';
  overlay.querySelector('.fx-name').textContent = name;
  overlay.addEventListener('click', ()=>endCelebration());
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('show'));

  fx.ca = overlay.querySelector('#fx-sparks'); fx.cb = overlay.querySelector('#fx-confetti');
  fxResize();
  fx.rockets = []; fx.sparks = []; fx.confetti = [];
  const times = [0,450,950,1350,1800,2250,2700,3150,3650,4100,4550,5000,5500];
  fx.schedule = times.map(t=>({t:t + Math.random()*120, n:1}));
  fx.schedule.push({t:6300, n:5});            // finale barrage
  fx.cannons = [{t:250},{t:3300}];
  fx.rainFrom = 1200; fx.rainUntil = 6500;

  fx.running = true;
  fx.t0 = performance.now(); fx.last = fx.t0;
  playFanfare(); playApplause();
  fx.raf = requestAnimationFrame(fxFrame);
}

function endCelebration(immediate){
  fx.running = false;
  if(fx.raf){ cancelAnimationFrame(fx.raf); fx.raf = 0; }
  const overlays = document.querySelectorAll('#fx-overlay');
  overlays.forEach(o=>{
    if(immediate){ o.remove(); return; }
    o.classList.remove('show');
    setTimeout(()=>o.remove(), 500);
  });
}

function fxLaunch(){
  const s = fx.s;
  const hues = [38,42,0,12,200,215,280,320,130,50];
  fx.rockets.push({
    x: fx.w*(0.1 + Math.random()*0.8), y: fx.h + 10,
    vx: (Math.random()-0.5)*1.6*s, vy: -(9 + Math.random()*3.2)*s,
    hue: hues[Math.floor(Math.random()*hues.length)], minY: fx.h*0.12
  });
  playWhoosh();
}

function fxExplode(x, y, hue){
  const s = fx.s, xa = fx.xa;
  const kind = Math.random();                       // <0.4 filled sphere, <0.75 ring, else double ring
  const count = 70 + Math.floor(Math.random()*60);
  const power = (4.2 + Math.random()*2.2)*s;
  const hue2 = (hue + 40 + Math.random()*60) % 360;
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    let sp = power, h = hue;
    if(kind < 0.4) sp = power*(0.3 + Math.random()*0.7);
    else if(kind < 0.75) sp = power*(0.97 + Math.random()*0.06);
    else if(i % 2){ sp = power*0.55; h = hue2; }
    else sp = power;
    fx.sparks.push({
      x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, hue:h,
      light: 60 + Math.random()*25, size: 2.2 + Math.random()*1.6,
      decay: 0.011 + Math.random()*0.01, life: 1
    });
  }
  // flash
  xa.beginPath(); xa.arc(x, y, 30*s, 0, Math.PI*2);
  xa.fillStyle = `hsla(${hue},100%,80%,0.55)`; xa.fill();
  playBoom(0.6 + Math.random()*0.4);
}

function fxConfettiPiece(x, y, vx, vy){
  if(fx.confetti.length > 1100) return;
  fx.confetti.push({
    x:x, y:y, vx:vx, vy:vy,
    w: 7 + Math.random()*7, h: 4 + Math.random()*6,
    rot: Math.random()*6.283, vr: (Math.random()-0.5)*0.35,
    flip: Math.random()*6.283, vf: 0.08 + Math.random()*0.18,
    phase: Math.random()*6.283, term: (3 + Math.random()*2.5)*fx.s,
    color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)]
  });
}

function fxCannons(){
  const s = fx.s;
  for(let i=0;i<140;i++){
    // left cannon fires up and to the right, right cannon up and to the left
    const aL = -(45 + Math.random()*30) * Math.PI/180;
    const aR = -(105 + Math.random()*30) * Math.PI/180;
    const spL = (12 + Math.random()*12)*s, spR = (12 + Math.random()*12)*s;
    fxConfettiPiece(Math.random()*20, fx.h - Math.random()*40, Math.cos(aL)*spL, Math.sin(aL)*spL);
    fxConfettiPiece(fx.w - Math.random()*20, fx.h - Math.random()*40, Math.cos(aR)*spR, Math.sin(aR)*spR);
  }
  tone({freq:220, slideTo:60, dur:0.25, type:'sine', gain:0.3});
  noiseBurst({dur:0.25, type:'lowpass', f0:2000, f1:300, gain:0.3});
}

function fxFrame(now){
  if(!fx.running) return;
  const elapsed = now - fx.t0;
  const dt = Math.min(2.5, Math.max(0.2, (now - fx.last)/16.67));
  fx.last = now;
  const s = fx.s;

  // timeline: rockets, confetti cannons, confetti rain
  while(fx.schedule.length && fx.schedule[0].t <= elapsed){
    const item = fx.schedule.shift();
    for(let k=0;k<item.n;k++) fxLaunch();
  }
  while(fx.cannons.length && fx.cannons[0].t <= elapsed){ fx.cannons.shift(); fxCannons(); }
  if(elapsed > fx.rainFrom && elapsed < fx.rainUntil){
    let spawn = 3*dt;
    while(spawn > 0){
      if(Math.random() < Math.min(1, spawn)) fxConfettiPiece(Math.random()*fx.w, -12, (Math.random()-0.5)*2, (1.5 + Math.random()*2)*s);
      spawn -= 1;
    }
  }

  // fireworks layer (fades previous frame to leave glowing trails)
  const xa = fx.xa;
  xa.globalCompositeOperation = 'destination-out';
  xa.fillStyle = 'rgba(0,0,0,0.2)';
  xa.fillRect(0, 0, fx.w, fx.h);
  xa.globalCompositeOperation = 'lighter';

  for(let i=fx.rockets.length-1;i>=0;i--){
    const r = fx.rockets[i];
    r.x += r.vx*dt; r.y += r.vy*dt; r.vy += 0.12*s*dt;
    xa.fillStyle = `hsla(${r.hue},100%,75%,0.9)`;
    xa.beginPath(); xa.arc(r.x, r.y, 2.2, 0, Math.PI*2); xa.fill();
    if(r.vy > -1.4*s || r.y < r.minY){ fx.rockets.splice(i,1); fxExplode(r.x, r.y, r.hue); }
  }

  xa.lineCap = 'round';
  for(let i=fx.sparks.length-1;i>=0;i--){
    const p = fx.sparks[i];
    const px = p.x, py = p.y;
    const fr = Math.pow(0.985, dt);
    p.vx *= fr; p.vy = p.vy*fr + 0.045*s*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.life -= p.decay*dt;
    if(p.life <= 0){ fx.sparks.splice(i,1); continue; }
    xa.strokeStyle = `hsla(${p.hue},100%,${p.light}%,${Math.min(1, p.life*1.4)})`;
    xa.lineWidth = p.size;
    xa.beginPath(); xa.moveTo(px, py); xa.lineTo(p.x, p.y); xa.stroke();
  }

  // confetti layer
  const xb = fx.xb;
  xb.clearRect(0, 0, fx.w, fx.h);
  for(let i=fx.confetti.length-1;i>=0;i--){
    const c = fx.confetti[i];
    const fr = Math.pow(0.992, dt);
    c.vx *= fr; c.vy = c.vy*fr + 0.22*s*dt;
    if(c.vy > c.term) c.vy = c.term;
    c.phase += 0.08*dt;
    c.x += (c.vx + Math.sin(c.phase)*0.6)*dt; c.y += c.vy*dt;
    c.rot += c.vr*dt; c.flip += c.vf*dt;
    if(c.y > fx.h + 30){ fx.confetti.splice(i,1); continue; }
    xb.save();
    xb.translate(c.x, c.y); xb.rotate(c.rot); xb.scale(1, Math.cos(c.flip));
    xb.fillStyle = c.color;
    xb.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    xb.restore();
  }

  const done = !fx.schedule.length && !fx.cannons.length && !fx.rockets.length &&
               !fx.sparks.length && !fx.confetti.length && elapsed > fx.rainUntil;
  if(done || elapsed > 16000){ endCelebration(); return; }
  fx.raf = requestAnimationFrame(fxFrame);
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }catch(e){ return iso; }
}
